# Bot Comandos Torre — config.
#
# Pídele uno a @BotFather (/newbot) y pega el token aquí.
# chat_id es tu chat personal de Telegram. Cualquier otro chat se ignora.

bot_token = "REPLACE_ME"
chat_id = 0

# Long-poll timeout (segundos) para Telegram getUpdates.
poll_timeout_s = 25

# Auto-borrado del chat. El bot manda muchos mensajes (alertas, reportes,
# tendencia, "torre iniciada"); a las N segundos se borran solos para
# que el chat no se llene. 0 desactiva. Telegram solo permite a un bot
# borrar SUS PROPIOS mensajes hasta 48h. El reaper chequea cada
# `chat_auto_delete_interval_s`. Cada lote borrado se loggea en audit
# como `chat_reaped`.
chat_auto_delete_s = 1800       # 30 min
chat_auto_delete_interval_s = 60

# ─── Monitor (loop de fondo) ─────────────────────────────────────────────
[monitor]
enabled = true
interval_s = 60      # cada cuánto muestrea métricas y chequea umbrales

# ─── Alertas (umbrales con histéresis + cooldown) ────────────────────────
# hi: dispara la alerta cuando se cruza ascendiendo.
# lo: rearma la alerta cuando se cruza descendiendo.
# cooldown_s: tiempo mínimo entre dos alertas iguales.

[alerts.cpu_pct]
hi = 90.0
lo = 75.0
cooldown_s = 600

[alerts.ram_pct]
hi = 90.0
lo = 80.0
cooldown_s = 600

[alerts.disk_pct]
hi = 90.0
lo = 80.0
cooldown_s = 3600

[alerts.cpu_temp_c]
hi = 85.0
lo = 75.0
cooldown_s = 600

[alerts.gpu_temp_c]
hi = 85.0
lo = 75.0
cooldown_s = 600

[alerts.gpu_pct]
hi = 95.0
lo = 80.0
cooldown_s = 900

[alerts.load1_per_core]
hi = 2.0
lo = 1.5
cooldown_s = 600

# ─── Histórico (SQLite + matplotlib opcional) ────────────────────────────
[history]
db_path = "/var/lib/bot-comandos-torre/metrics.db"
retain_days = 14

# ─── Auditoría (JSONL append-only) ───────────────────────────────────────
[audit]
log_path = "/var/log/bot-comandos-torre/audit.log"

# ─── Red ─────────────────────────────────────────────────────────────────
[network]
ping_hosts = ["1.1.1.1", "8.8.8.8"]

# ─── Servicios ───────────────────────────────────────────────────────────
[services]
# Estos aparecen en "Activos clave" (solo lectura).
watch = [
    "sshd",
    "NetworkManager",
    "systemd-resolved",
    "sudo-telegram",
    "claude-telegram",
    "bot-comandos-torre",
    "docker",
]
# Estos aparecen en "Controlar" — start/stop/restart vía polkit narrow-scope.
# Tienen que estar también listados en 50-bot-comandos-torre.rules.
manageable = [
    "sshd",
    "NetworkManager",
    "sudo-telegram",
    "claude-telegram",
    "docker",
]

# ─── SSH multihost (opcional) ────────────────────────────────────────────
# Cada [hosts.<nombre>] aparece como botón en "🌐 Otros hosts".
# ssh_alias se resuelve vía /home/sergioc/.ssh/config (que el daemon lee
# read-only). Las claves privadas también se leen desde ahí.
# El daemon usa BatchMode=yes y ConnectTimeout=5, así que un host caído
# no cuelga la UI.
#
# [hosts.vpspriv]
# ssh_alias = "vpspriv"
# [hosts.vpsgames]
# ssh_alias = "vpsgames"

[ssh]
known_hosts = "/var/lib/bot-comandos-torre/known_hosts"

# ─── Updates (Arch / CachyOS) ────────────────────────────────────────────
# El menú /updates lista paquetes pendientes y ofrece un botón
# "🔄 Aplicar" cuando hay updates. Ese botón arranca el oneshot
# `pacman-update.service` (instalado por INSTALL.sh) vía polkit narrow-
# scope — sin sudo en runtime. El bot pollea estado y avisa por chat
# cuando termina con las últimas líneas del journal.
[updates]
# Cómo listar updates pendientes. Default: checkupdates (paquete
# pacman-contrib) — recomendado porque sincroniza una DB temporal
# sin tocar /var/lib/pacman/sync.
# Otra opción: ["pacman", "-Qu"] (requiere DB ya sincronizada).
command = ["checkupdates"]

# ─── SMART (salud de discos) ─────────────────────────────────────────────
# Lista de devices a chequear. smartctl normalmente requiere root —
# si quieres usarlo desde aquí, activa [sudo] enabled = true (requiere
# sudo-telegram y aprobación cada vez), o agrega el binario a sudoers
# con NOPASSWD para sergioc, o deja la lista vacía.
[smart]
devices = []
# devices = ["/dev/nvme0n1"]

# ─── sudo (opcional, para SMART y otras acciones que requieren root) ─────
# Si true, comandos como smartctl se invocan con `sudo -A`. Eso dispara
# una aprobación en @tu_bot_de_sudo_bot (sudo-telegram). Requiere que
# SUDO_ASKPASS esté seteado y que el grupo sudo-telegram esté en
# SupplementaryGroups del unit.
[sudo]
enabled = false

# ─── Apps (lanzar aplicaciones GUI desde el celular) ─────────────────────
# Cada [apps.<nombre>] aparece como botón en "🚀 Apps". El bot las lanza
# con `systemd-run --user --collect --quiet -- <cmd>` contra el systemd
# manager del usuario, así heredan DISPLAY/WAYLAND_DISPLAY/etc. de tu
# sesión gráfica.
#
# Requisitos:
#   · Sesión de sergioc activa (login gráfico abierto). Sin sesión, el
#     systemd --user no está corriendo y el lanzamiento falla con
#     "Failed to connect to bus". Si querés que funcione sin sesión
#     activa: `loginctl enable-linger sergioc` (no recomendado, las apps
#     GUI quedarían huérfanas hasta que abras niri).
#   · cmd = lista (no string) — el primer elemento es el ejecutable, el
#     resto son args. Sin shell expansion, sin globs.
#   · label es opcional; default es el nombre de la sección.
#
# [apps.firefox]
# cmd = ["firefox"]
# label = "🦊 Firefox"
#
# [apps.discord]
# cmd = ["discord"]
# label = "💬 Discord"
#
# [apps.steam]
# cmd = ["steam"]
# label = "🎮 Steam"
#
# [apps.obsidian-ciencias]
# cmd = ["obsidian", "obsidian://open?vault=Ciencias-"]
# label = "📓 Obsidian (Ciencias)"

# ─── Media / MPRIS (playerctl) ───────────────────────────────────────────
# Controles play/pause/next/prev/volumen sobre cualquier reproductor con
# soporte MPRIS (Spotify, Brave/YouTube, mpv, Apple Music, etc.). Requiere
# el paquete `playerctl`.
#
# ignore_players: nombres exactos (los que devuelve `playerctl -l`) que
# no quieres ver en el menú — útil para esconder players efímeros.
#
[mpris]
ignore_players = []
# ignore_players = ["chromium.instance123"]

# ─── Red: vecinos LAN + Wake-on-LAN ──────────────────────────────────────
# /scan, /red, /wake. Necesita los paquetes `iproute2` (ya viene), `wol`
# y `traceroute`. Los hosts en [red.wake] son alias-a-MAC; el alias se
# pasa a /wake y a los botones del menú.
#
# [red.wake]
# notebook = "AA:BB:CC:DD:EE:FF"
# tv       = "11:22:33:44:55:66"
[red.wake]

# ─── VPS bridge (SSH) ────────────────────────────────────────────────────
# Cada [vps.hosts.<alias>] aparece en el menú "☁️ VPS". El daemon corre
# `ssh -o BatchMode=yes -o ConnectTimeout=5 <ssh_alias> bash -lc <cmd>` y
# muestra el output. El default de summary_cmd lista uptime, disco /,
# memoria y `docker ps`.
#
# [vps.hosts.vpspriv]
# ssh_alias = "vpspriv"
# # summary_cmd = "uptime; docker ps --format '{{.Names}} {{.Status}}'"
#
# [vps.hosts.cloudpanel]
# ssh_alias = "cloudpanel"
[vps.hosts]

# ─── Steam / Games ───────────────────────────────────────────────────────
# Lista los juegos instalados leyendo
# ~/.local/share/Steam/steamapps/appmanifest_*.acf y los lanza con
# `gamescope-auto` (si está en ~/.local/bin/) o `steam directo`. Los
# runtimes/Proton/Steamworks se filtran por nombre y por exclude_appids.
#
[steam]
use_gamescope = true
exclude_appids = [
    "228980",   # Steamworks Common Redistributables
    "1070560",  # Steam Linux Runtime 1.0 (scout)
    "1391110",  # Steam Linux Runtime 2.0 (soldier)
    "1493710",  # Proton Experimental
    "1628350",  # Steam Linux Runtime 3.0 (sniper)
    "4183110",  # Steam Linux Runtime 4.0
]

# ─── Obsidian (notas rápidas al inbox) ───────────────────────────────────
# `/nota <texto>` hace append al archivo apuntado por inbox_path con
# timestamp. Si el HDD/vault no está montado, la nota se rechaza con
# mensaje claro (no se loggea silenciosamente).
#
[obsidian]
inbox_path = ""
# inbox_path = "/run/media/sergioc/HDD/Obsidian/Obsidian-Ciencias-/Obsidian Ciencias/Inbox.md"
